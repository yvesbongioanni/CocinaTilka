<style>
*{box-sizing:border-box;-webkit-box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#fcfaf5;color:#1d2a1b;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:rgba(0,0,0,0)}
button{font-family:inherit;font-size:inherit;cursor:pointer;-webkit-appearance:none;border-radius:10px}
input{font-family:inherit;-webkit-appearance:none;border-radius:8px}
.wrap{padding:20px 20px 60px;max-width:1024px;margin:0 auto}
h1{margin:0 0 4px;font-size:30px;font-weight:800;color:#274224}

.label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5f6b5c}

.red-dot{display:inline-block;width:12px;height:12px;border-radius:6px;background:#c43a2b;margin-right:8px}
.cards{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:10px -7px 0}
.card{width:50%;padding:7px}
.card button{width:100%;background:#fff;border:2px solid #e3ded2;padding:18px;text-align:left;color:#1d2a1b;min-height:130px}
.card b{display:block;font-size:22px;margin-bottom:8px}
.card span{display:block;color:#5f6b5c;font-size:15px;margin-top:2px}
.tag{display:inline-block !important;margin-top:10px !important;border-radius:20px;padding:3px 10px;font-size:13px !important;font-weight:700}
.tag.ok{background:#dcefdc;color:#2f7a3a !important}
.tag.warn{background:#fbecd2;color:#9a5c05 !important}
.btn{border:0;background:#274224;color:#fcfaf5;font-weight:700;padding:14px 20px}
.btn.red{background:#c43a2b}
.btn.ghost{background:#fff;color:#1d2a1b;border:2px solid #e3ded2}
.btn.big{font-size:22px;padding:18px 28px}
.back{background:none;border:0;color:#5f6b5c;font-weight:700;padding:6px 0;margin-bottom:8px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.boveda{background:#e3f0f5;border-radius:12px;padding:10px 16px;margin:12px 0}
.boveda div{display:inline-block;margin-right:24px}

.panel{background:#fff;border:2px solid #e3ded2;border-radius:14px;padding:16px;margin-top:14px}
.porc input{width:130px;font-size:36px;font-weight:800;text-align:center;border:2px solid #e3ded2;padding:6px;margin:0 8px}
.porc .btn{width:60px;height:60px;padding:0;font-size:28px}
.alert{border-radius:10px;padding:10px 14px;margin-top:8px;font-size:15px}
.alert.warn{background:#fbecd2}
.alert.bad{background:#f6dcd8}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid #e3ded2}
.checks label{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:12px 2px}
.checks input{width:26px;height:26px;margin:0 12px 0 0;-webkit-appearance:checkbox;-webkit-flex:none;flex:none}
.checks .nm{-webkit-flex:1;flex:1}
.checks .nt{display:block;font-size:13px;color:#5f6b5c}
.checks .q{font-weight:800;font-size:21px;text-align:right;white-space:nowrap;margin-left:10px}
.checks .q small{font-size:13px;color:#5f6b5c;margin-left:3px}
.checks li.done .nm{text-decoration:line-through;color:#5f6b5c}
ol.pasos{margin:6px 0 0;padding-left:24px;color:#5f6b5c;font-size:15px}
ol.pasos li{margin-bottom:3px}

.cook{position:fixed;top:0;left:0;right:0;bottom:0;background:#274224;color:#fcfaf5;overflow:auto;-webkit-overflow-scrolling:touch;z-index:10}
.cook.window{background:#5a4a14}
.cook.alarm{background:#c43a2b}
.cook.alarm.blink{background:#7e1f15}
.ctop{padding:12px 20px;border-bottom:1px solid rgba(252,250,245,.2)}
.ctop .t{-webkit-flex:1;flex:1;font-weight:800;font-size:18px}
.cbtn{background:rgba(252,250,245,.12);border:2px solid rgba(252,250,245,.35);color:#fcfaf5;font-weight:700;padding:10px 14px;margin-left:8px;font-size:15px}
.cbtn.on{background:#fcfaf5;color:#274224}
.prog{display:-webkit-flex;display:flex;padding:10px 20px 0}
.prog i{-webkit-flex:1;flex:1;height:8px;border-radius:4px;background:rgba(252,250,245,.2);margin-right:4px}
.prog i.d{background:#8ec0d2}
.prog i.c{background:#fcfaf5}
.cmain{display:-webkit-flex;display:flex;padding:16px 20px;-webkit-align-items:flex-start;align-items:flex-start}
.cleft{-webkit-flex:1.2;flex:1.2;padding-right:20px}
.cright{-webkit-flex:1;flex:1}
.sno{font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.stitle{font-size:44px;font-weight:800;line-height:1.05;margin:6px 0 14px}
.fire span{display:inline-block;margin:0 10px 8px 0}
.fire .f{background:#fcfaf5;color:#c43a2b;border-radius:20px;padding:6px 16px;font-weight:800;font-size:20px}
.fire .h{font-size:19px;font-weight:600}
.timer{font-size:150px;font-weight:800;line-height:1;letter-spacing:-4px;margin:6px 0 4px}
.tsub{font-size:19px;font-weight:600;min-height:26px}
.snote{background:rgba(252,250,245,.12);border-radius:10px;padding:10px 14px;margin-top:12px}
.ing{background:#fcfaf5;color:#1d2a1b;border-radius:14px;padding:12px 16px;margin-bottom:10px}
.ing .r{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.ing .n{-webkit-flex:1;flex:1;font-size:23px;font-weight:800}
.ing .q{font-size:36px;font-weight:800;color:#c43a2b;white-space:nowrap}
.ing .q small{font-size:17px;color:#5f6b5c;margin-left:4px}
.ing .x{font-size:14px;color:#5f6b5c;margin-top:2px}
.next{border:2px dashed rgba(252,250,245,.45);border-radius:14px;padding:12px 16px;margin-top:6px}
.next.soon{border-style:solid;border-color:#fcfaf5;background:rgba(252,250,245,.1)}
.next .nt{font-size:22px;font-weight:800;margin-top:4px}
.cbot{display:-webkit-flex;display:flex;padding:12px 20px 24px;-webkit-align-items:stretch;align-items:stretch}
.cbot .cbtn{margin:0 8px 0 0;font-size:17px;padding:14px 14px}
.listo{-webkit-flex:1;flex:1;background:#fcfaf5;color:#274224;border:0;border-radius:16px;font-size:34px;font-weight:800;padding:20px}
.cook.alarm .listo{color:#c43a2b}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:20}
.modal .box{background:#fff;color:#1d2a1b;border-radius:16px;padding:22px;width:420px;max-width:92%;margin:120px auto 0}
.modal .box p{margin:8px 0 18px}
table{border-collapse:collapse;width:100%}
td,th{padding:9px 8px;border-bottom:1px solid #e3ded2;text-align:left}
@media (max-width:700px){.card{width:100%}.cmain{display:block}.cleft{padding-right:0}.timer{font-size:96px}.stitle{font-size:32px}}
.voz-panel{margin-top:34px;background:var(--surface,#fff);border:1.5px solid var(--line,#e3ded2);border-radius:14px;padding:16px}
.voz-row{display:flex;display:-webkit-flex;flex-wrap:wrap;-webkit-flex-wrap:wrap;align-items:center;-webkit-align-items:center}
.voz-row select{font-size:16px;padding:10px;margin:0 10px 10px 0;max-width:100%;border:1.5px solid var(--line,#e3ded2);border-radius:8px;background:var(--surface,#fff);color:var(--ink,#1d2a1b)}
.voz-row .btn{margin-bottom:10px}
.hint{font-size:13px;color:#5f6b5c}
.btn.small{padding:9px 14px;font-size:15px}
.ped-tabs{display:flex;display:-webkit-flex;margin:0 0 18px;border-bottom:2px solid #e3ded2;border-bottom-color:var(--line,#e3ded2)}
.ped-tab{background:none;border:0;border-radius:0;padding:10px 18px;font-weight:800;font-size:17px;color:#5f6b5c;color:var(--muted,#5f6b5c);border-bottom:3px solid transparent;margin-bottom:-2px}
.ped-tab.on{color:#c43a2b;border-bottom-color:#c43a2b}
.ped-lead{margin:0 0 12px;color:#5f6b5c;color:var(--muted,#5f6b5c)}
.ped-recs{display:flex;display:-webkit-flex;flex-wrap:wrap;-webkit-flex-wrap:wrap;margin:0 -6px}
.ped-rec{width:33.33%;padding:6px;display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center}
.ped-rec span{flex:1;-webkit-flex:1;font-weight:700;background:#fff;background:var(--surface,#fff);border:1.5px solid #e3ded2;border-color:var(--line,#e3ded2);border-right:0;border-radius:10px 0 0 10px;padding:12px;min-height:50px;font-size:15px}
.ped-rec input{width:80px;font-size:22px;font-weight:800;text-align:center;border:1.5px solid #e3ded2;border-color:var(--line,#e3ded2);border-radius:0 10px 10px 0;padding:10px 4px;min-height:50px;background:#fff;background:var(--surface,#fff);color:inherit}
.ped-rec small{display:none}
.ped-opts{display:flex;display:-webkit-flex;flex-wrap:wrap;-webkit-flex-wrap:wrap;align-items:center;-webkit-align-items:center;margin:14px 0 8px}
.ped-opts label{font-weight:700;margin-right:12px}
.ped-opts select{font-size:16px;padding:8px;margin-left:6px;border-radius:8px;border:1.5px solid #e3ded2}
.ped-hint{font-size:13px;color:#5f6b5c;color:var(--muted,#5f6b5c);margin-left:12px}
.ped-btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;color:#fcfaf5;background:#274224;font-size:15px}

.ped-cats{display:flex;display:-webkit-flex;align-items:flex-start;-webkit-align-items:flex-start;flex-wrap:wrap;-webkit-flex-wrap:wrap;margin:6px -7px 0}
.ped-cat{width:calc(50% - 14px);margin:7px;background:#fff;background:var(--surface,#fff);border:1.5px solid #e3ded2;border-color:var(--line,#e3ded2);border-top:6px solid #5f6b5c;border-radius:12px;padding:12px 14px}
.ped-cat-h{display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;margin-bottom:4px}

.ped-cat li{border-bottom:1px solid #eee8dc;border-bottom-color:var(--line,#eee8dc)}

.ped-cat input{width:22px;height:22px;margin:0 10px 0 0;-webkit-appearance:checkbox;flex:none;-webkit-flex:none}
.ped-n{flex:1;-webkit-flex:1;font-weight:700}
.ped-n small{display:block;font-weight:400;font-size:12px;color:#5f6b5c;color:var(--muted,#5f6b5c)}
.ped-q{font-weight:900;font-size:19px;white-space:nowrap;margin-left:10px}
.ped-cat li.off .ped-n,.ped-cat li.off .ped-q{text-decoration:line-through;opacity:.45}
.ped-empty{margin-top:20px;color:#5f6b5c;color:var(--muted,#5f6b5c)}
.ped-toast{position:fixed;bottom:20px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#274224;color:#fcfaf5;padding:10px 18px;border-radius:10px;font-weight:700;z-index:90}
.ped-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:95}
.ped-box{background:#fff;color:#1d2a1b;border-radius:14px;padding:18px;width:460px;max-width:92%;margin:80px auto 0}
.ped-box textarea{width:100%;margin-top:10px;font-size:16px;border:1.5px solid #e3ded2;border-radius:8px;padding:8px}
@media (max-width:820px){.ped-rec{width:50%}.ped-cat{width:calc(100% - 14px)}}
@media (max-width:520px){.ped-rec{width:100%}}
.st-summary{margin:4px 0 6px}
.tag.bad{background:#f6dcd8;color:#c43a2b}
.st-tools{margin-bottom:6px}
.st-m{display:inline-block;border:2px solid #e3ded2;border-radius:20px;padding:6px 12px;font-weight:700;margin:4px 4px 0 0}
.st-m.on{border-color:#274224;background:#dcefdc}
.st-m input{-webkit-appearance:radio;margin-right:4px}
.st-list{list-style:none;margin:0;padding:0}
.st-list li{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:8px 0;border-bottom:1px solid #eee8dc}
.st-list li:last-child{border-bottom:0}
.st-name{-webkit-flex:1;flex:1;background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:16px;color:#1d2a1b;text-decoration:underline}
.st-cant{font-weight:800;font-size:18px;text-align:right;white-space:nowrap;margin:0 10px}
.st-cant small{display:block;font-weight:400;font-size:12px;color:#5f6b5c}
.st-list li.nuevo .st-cant{font-weight:400;font-size:14px;color:#5f6b5c}
.st-list li.low .st-cant{color:#b86e00}
.st-list li.neg .st-cant{color:#c43a2b}
.st-in input{width:70px;text-align:right;font-weight:700;font-size:17px;border:2px solid #e3ded2;padding:6px}
.st-in small{display:inline-block;width:30px;font-size:12px;color:#5f6b5c;margin-left:3px}
.st-save{position:-webkit-sticky;position:sticky;bottom:0;background:#fcfaf5;padding:12px 0;border-top:1px solid #e3ded2;margin-top:10px}
.st-form label{display:block;font-weight:700;font-size:14px;margin-top:10px}
.st-form input,.st-form select{display:block;width:100%;font-size:17px;padding:8px;border:2px solid #e3ded2;margin-top:4px}
.st-det{list-style:none;margin:6px 0 0;padding:0}
.st-det li{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e3ded2;font-size:15px}
.st-det li.neg span:last-child{color:#c43a2b;font-weight:700}
.st-det li.skip span:last-child{color:#b86e00}
.ped-q .ped-st{display:block;font-weight:400;font-size:12px;color:#5f6b5c}
.ped-ok{color:#2f7a3a;font-size:15px}
.ped-restar input{-webkit-appearance:checkbox;margin-right:4px}
</style>
</head>

function pFmt(v,dec){

  var parts=v.toFixed(dec).split("."), ent=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
  var d=parts[1]? parts[1].replace(/0+$/,"") : "";
  return ent+(d? ","+d : "");
}
function pCeil(v,step){ return Math.ceil(v/step - 1e-9)*step; }
function pQty(total,u){
  if(u==="g"){ if(total>=1000) return pFmt(pCeil(total/1000,0.1),1)+" kg"; return pFmt(pCeil(total,10),0)+" g"; }
  if(u==="ml"){ if(total>=1000) return pFmt(pCeil(total/1000,0.1),1)+" L"; return pFmt(pCeil(total,50),0)+" ml"; }
  if(u==="hojas") return pFmt(Math.ceil(total),0)+" hojas";
  if(u==="cdta"||u==="cda") return pFmt(pCeil(total,0.5),1)+" "+u;
  return pFmt(total,1)+(u? " "+u:"");
}
var PED = (function(){ var v=null; try{ v=JSON.parse(localStorage.getItem("tilka-pedido-v1")); }catch(e){} return v||{porc:{},margen:0,off:{}}; })();

function pedCompute(recetas){
  var items={}, order=[], m=1+(Number(PED.margen)||0)/100;
  for(var r=0;r<recetas.length;r++){
    var rec=recetas[r], p=Number(PED.porc[rec.id])||0; if(p<=0) continue;
    for(var i=0;i<rec.ingredientes.length;i++){
      var ing=rec.ingredientes[i], nk=pNorm(ing.n); if(nk==="agua") continue;
      var cat=catOf(ing), key=cat+"|"+nk+"|"+(ing.q==null? "nota" : (ing.u||""));
      if(!items[key]){ items[key]={key:key, n:ing.n.replace(/\s*\(.*?\)\s*/g,""), cat:cat, u:ing.u||"", total:0, parts:[], nota:ing.q==null}; order.push(key); }
      var it=items[key];
      if(ing.q==null){ it.parts.push(rec.nombre+": "+(ing.nota||"a gusto")); }
      else { var q=ing.q*p*m; it.total+=q; it.parts.push(rec.nombre+" "+pQty(q,ing.u)); }
    }
  }
  var restar = PED.restar!==false;
  for(var z=0;z<order.length;z++){ var y=items[order[z]]; y.amt=y.total; y.stock=null;
    if(!y.nota){ y.stock=pedStockLookup(pNorm(y.n),y.u); if(restar && y.stock!=null) y.amt=Math.max(0,y.total-y.stock); } }
  var byCat={};
  for(var k=0;k<order.length;k++){ var x=items[order[k]]; (byCat[x.cat]=byCat[x.cat]||[]).push(x); }
  for(var c in byCat) byCat[c].sort(function(a,b){ return a.nota-b.nota || b.total-a.total; });
  return byCat;
}
function pedText(cat,list){
  var lines=["Pedido Tilka · "+catInfo(cat).n.replace(/\s*\(.*\)/,""),""];
  for(var i=0;i<list.length;i++){ var x=list[i]; if(PED.off[x.key]) continue; if(!x.nota && !(x.amt>0)) continue;
    lines.push("• "+x.n+": "+(x.nota? "a gusto" : pQty(x.amt,x.u))); }
  return lines.join("\n");
}
function pedCopy(text){
  var done=false;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ pedToast("Copiado. Pegalo en WhatsApp o en el mail."); },function(){ pedShowText(text); }); return; } }catch(e){}
  try{ var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="0"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length); done=document.execCommand("copy"); document.body.removeChild(ta); }catch(e){ done=false; }
  if(done) pedToast("Copiado. Pegalo en WhatsApp o en el mail."); else pedShowText(text);
}
function pedToast(m){ var t=document.createElement("div"); t.className="ped-toast"; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },2600); }
function pedShowText(text){
  var d=document.createElement("div"); d.className="ped-modal";
  d.innerHTML='<div class="ped-box"><b>Mantené apretado el texto y tocá Copiar</b><textarea id="pedTA" readonly rows="12"></textarea><div style="text-align:right;margin-top:10px"><button class="ped-btn" id="pedClose">Listo</button></div></div>';
  document.body.appendChild(d); var ta=document.getElementById("pedTA"); ta.value=text;

  document.getElementById("pedClose").onclick=function(){ d.parentNode.removeChild(d); };
}

}

function stockKey(name){ return pNorm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x"; }
function stockUnitIn(u){ return u==="g"? "kg" : u==="ml"? "L" : (u||"u"); }
function stockToBase(v,u){ return (u==="g"||u==="ml")? v*1000 : v; }
function fmtStock(v,u){
  v=Number(v)||0; var neg=v<0, a=Math.abs(v), s;
  if(u==="g") s = a>=1000? pFmt(a/1000,2)+" kg" : pFmt(a,0)+" g";
  else if(u==="ml") s = a>=1000? pFmt(a/1000,2)+" L" : pFmt(a,0)+" ml";
  else s = pFmt(a,1)+" "+(u||"u");
  return (neg?"−":"")+s;
}
function parseNum(s){ s=String(s||"").replace(/\s/g,""); if(s==="") return null;
  if(s.indexOf(",")>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  var n=Number(s); return isNaN(n)? null : n; }
function needFor(rec,p){
  var m={}, out=[];
  for(var i=0;i<rec.ingredientes.length;i++){ var ing=rec.ingredientes[i];
    if(ing.q==null || pNorm(ing.n)==="agua") continue;
    var key=stockKey(ing.n), k2=key+"|"+(ing.u||"");
    if(!m[k2]){ m[k2]={key:key, n:ing.n.replace(/\s*\(.*?\)\s*/g,""), cat:catOf(ing), u:ing.u||"", q:0}; out.push(m[k2]); }
    m[k2].q += ing.q*p; }
  return out;
}
function stockWarnings(rec,p){
  if(!p) return []; var f=[], need=needFor(rec,p);
  for(var i=0;i<need.length;i++){ var x=need[i], it=STK.items[x.key]; if(it && it.u===x.u && (Number(it.cant)||0) < x.q) f.push(x.n+" (hay "+fmtStock(it.cant,it.u)+", necesitás "+fmtStock(x.q,x.u)+")"); }
  return f.length? [{t:"warn",m:"Stock insuficiente: "+f.join(" · ")}] : [];
}
function pedStockLookup(nk,u){ var it=STK.items[stockKey(nk)]; if(!it||it.u!==u) return null; return Math.max(0,Number(it.cant)||0); }

function descontarStock(rec,p,quien){
  var det=[], need=needFor(rec,p), used=[];
  for(var i=0;i<need.length;i++){ var x=need[i], it=STK.items[x.key];
    if(!it){ x.sin=true; x.skip="no está cargado en stock"; det.push(x); continue; }
    if(it.u!==x.u){ x.skip="está cargado en "+stockUnitIn(it.u); det.push(x); continue; }
    it.cant=Math.round(((Number(it.cant)||0)-x.q)*10)/10; it.t=Date.now(); x.after=it.cant; det.push(x); used.push({n:x.n,u:x.u,delta:-x.q}); }
  addMov({tipo:"coccion", receta:rec.nombre, porciones:p, quien:quien||"", det:used}); stkSave();
  return det;
}

/* cocción */
function startRun(){
  unlockAudio(); var pi=document.getElementById("porc"); if(pi&&Number(pi.value)>0) S.porciones=Number(pi.value);
  var r=byId(S.rid), now=Date.now();
  S.run={rec:JSON.parse(JSON.stringify(r)), p:Number(S.porciones), cocinero:S.cocinero, idx:0, inicio:now, stepStart:now, pausedAt:null, pausedTotal:0, flags:{}, log:[], muted:false};
  lsSet(LS_RUN,S.run); beep("tick"); speakStep(S.run.rec,0,S.run.p,"Arrancamos. Paso 1: "); render();
}
function elapsed(){ var R=S.run, end=R.pausedAt||Date.now(); return (end-R.stepStart-R.pausedTotal)/1000; }
function save(){ lsSet(LS_RUN,S.run); }
function nextStep(){
  unlockAudio();
  var R=S.run, rec=R.rec; R.log.push({t:rec.pasos[R.idx].t, dur:Math.round(elapsed())});
  if(R.idx>=rec.pasos.length-1) return finishRun();
  R.idx++; R.stepStart=Date.now(); R.pausedAt=null; R.pausedTotal=0; R.flags={}; R.muted=false; save();
  beep("tick"); speakStep(rec,R.idx,R.p,"Paso "+(R.idx+1)+": "); renderCook();
}
function prevStep(){ var R=S.run; if(!R.idx) return; R.idx--; R.log.pop(); R.stepStart=Date.now(); R.pausedAt=null; R.pausedTotal=0; R.flags={}; R.muted=false; save(); renderCook(); }
function finishRun(){
  var R=S.run; S.last={receta:R.rec.nombre, porciones:R.p, cocinero:R.cocinero, inicio:R.inicio, fin:Date.now(), pasos:R.log, stock:descontarStock(R.rec,R.p,R.cocinero)};
  S.run=null; lsSet(LS_RUN,null); S.view="done"; say("Cocción terminada. Esparcir caliente en las bandejas."); beep("soft"); render();
}

  h+='<div class="prog">'; for(i=0;i<rec.pasos.length;i++) h+='<i class="'+(i<R.idx?"d":i===R.idx?"c":"")+'"></i>'; h+='</div>';
  h+='<div class="cmain"><div class="cleft"><div class="sno">Paso '+(R.idx+1)+' de '+rec.pasos.length+'</div><div class="stitle">'+esc(s.t)+'</div><div class="fire">'+(s.fuego?'<span class="f">Fuego '+esc(s.fuego)+'</span>':'')+(s.hasta?'<span class="h">Hasta que: '+esc(s.hasta)+'</span>':'')+'</div>';

    h+='<div class="ing"><div class="r"><div class="n">'+esc(x.ing.n)+'</div><div class="q">'+(x.q!=null? fmtQty(x.q,x.ing.u)+'<small>'+esc(uLabel(x.ing.u))+'</small>' : x.split? '<small>repartir</small>' : '<small>'+esc(x.ing.nota||"a gusto")+'</small>')+'</div></div>'+(x.extra?'<div class="x">'+esc(x.extra)+'</div>':'')+'</div>'; } }

var blink=false;
function tick(){
  var R=S.run, el=document.querySelector(".cook"); if(!R||!el) return;
  var s=R.rec.pasos[R.idx], nx=R.rec.pasos[R.idx+1], e=elapsed();
  var T=document.getElementById("timer"), sub=document.getElementById("tsub"), nextEl=document.getElementById("next"), mute=document.getElementById("mute");
  if(!T) return;
  document.getElementById("tot").textContent="Total "+fmtT((Date.now()-R.inicio)/1000)+"  ";
  var mode="normal", txt, st, soon=false, nxName=nx? nx.t : "terminar";
  if(s.min==null){ txt=fmtT(e); st=R.pausedAt? "En pausa" : "Sin tiempo fijo · tocá LISTO cuando esté"; }
  else if(e<s.min){ txt=fmtT(s.min-e); st=(s.max? "Mínimo "+human(s.min)+" · máximo "+human(s.max) : "Duración "+human(s.min))+(R.pausedAt?" · En pausa":"");
    if(s.min-e<=30 && s.min>=60 && !R.flags.pre){ R.flags.pre=true; save(); beep("tick"); say("Preparate. En 30 segundos: "+nxName); }
    soon = s.min-e<=30; }
  else if(s.max && e<s.max){ mode="window"; txt=fmtT(s.max-e); st="Chequeá el punto"+(s.hasta? ": "+s.hasta.toLowerCase():"")+" · quedan hasta el máximo"; soon=true;
    if(!R.flags.min){ R.flags.min=true; save(); beep("soft"); say("Tiempo mínimo cumplido. Chequeá"+(s.hasta? " que "+s.hasta.toLowerCase():"")+". Si está, tocá listo"+(nx? " y sigue: "+nx.t : "")+"."); } }
  else { mode="alarm"; soon=true; txt="+"+fmtT(e-(s.max||s.min)); st= nx? "¡Hora de pasar al paso siguiente! "+nx.t : "¡Tiempo! Tocá LISTO para terminar";
    if(!R.muted && !R.pausedAt && Date.now()-(R.flags.alarmAt||0)>15000){ R.flags.alarmAt=Date.now(); save(); beep("alarm");
      if(!R.flags.said){ R.flags.said=true; if(nx) speakStep(R.rec,R.idx+1,R.p,"Hora de: "); else say("Tiempo. Terminamos."); } } }
  if(s.avisoCada && !R.pausedAt){ var n=Math.floor(e/s.avisoCada); if(n>0 && n!==R.flags.aviso){ R.flags.aviso=n; save(); beep("soft"); say("Revolver"); } if(mode==="normal") st+=" · aviso para revolver cada "+human(s.avisoCada); }
  T.textContent=txt; sub.textContent=st;
  nextEl.className="next"+(soon?" soon":"");
  blink=!blink;
  el.className="cook"+(mode==="window"?" window":"")+(mode==="alarm"&&!R.pausedAt? " alarm"+(blink?" blink":""):"");
  mute.style.display=(mode==="alarm"&&!R.muted)? "":"none";
}
setInterval(function(){ if(S.run) tick(); },500);

  var d=S.last, h='<div class="wrap"><p class="label">Cocción terminada</p><h2>'+esc(d.receta)+' · '+d.porciones+' porciones</h2><p class="muted">'+(d.cocinero? esc(d.cocinero)+' · ':'')+'Duración total '+fmtT((d.fin-d.inicio)/1000)+'</p><div class="panel"><table><tr><th>#</th><th>Paso</th><th>Tiempo real</th></tr>';
  for(var i=0;i<d.pasos.length;i++) h+='<tr><td>'+(i+1)+'</td><td>'+esc(d.pasos[i].t)+'</td><td>'+fmtT(d.pasos[i].dur)+'</td></tr>';
  h+='</table></div><div class="panel"><p class="label" style="margin-top:0">Stock de materia prima</p>'+stockDetHTML(d.stock||[])+'</div><p><button class="btn big" id="home">Volver al inicio</button></p></div>';
  app.innerHTML=h; document.getElementById("home").onclick=function(){ S.view="home"; render(); };
}
document.addEventListener("touchstart",unlockAudio,false);
render();
</script>
</body>
</html>
